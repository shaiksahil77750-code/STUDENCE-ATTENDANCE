kind = "web"
previewPath = "/"
title = "Attendease"
description = "A polished attendance and academic planning workspace for schools, combining daily attendance, timetable management, analytics, leave planning, and AI-assisted review in one focused experience."
version = "1.0.0"
id = "artifacts/attendease"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21799

[services.development]
run = "pnpm --filter @workspace/attendease run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attendease", "run", "build" ]
serve = "static"
publicDir = "artifacts/attendease/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21799"
BASE_PATH = "/"
